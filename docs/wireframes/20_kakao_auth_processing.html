<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>20. 카카오 인증 처리중</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" /><style>
:root{--bg:#F4F8FC;--surface:#FFFFFF;--ink:#1C2733;--muted:#7C8794;--primary:#18A8F1;--primary-dark:#0E74AD;--accent:#FFBE0F;--danger:#E5484D;--border:#E1E8EF;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fff;display:flex;justify-content:center;}
.frame{width:375px;min-height:812px;background:var(--bg);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;}
.center{text-align:center;}
.spinner{width:52px;height:52px;border-radius:50%;border:5px solid #E1E8EF;border-top-color:var(--primary);margin:0 auto 24px;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.center h2{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:6px;}
.center p{font-size:12.5px;color:var(--muted);}
.page-header{position:absolute;top:28px;left:0;right:0;text-align:center;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.3px;}
</style></head><body>
<div class="frame">
  <div class="page-header">로그인 처리 중</div>
  <div class="center">
    <div class="spinner"></div>
    <h2>카카오 로그인 확인 중</h2>
    <p>잠시만 기다려주세요...</p>
  </div>
</div>
</body></html>
