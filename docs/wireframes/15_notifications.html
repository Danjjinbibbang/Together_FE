<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>15. 알림함</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" /><style>
:root{--bg:#F4F8FC;--surface:#FFFFFF;--ink:#1C2733;--muted:#7C8794;--primary:#18A8F1;--primary-dark:#0E74AD;--accent:#FFBE0F;--danger:#E5484D;--border:#E1E8EF;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fff;display:flex;justify-content:center;}
.frame{width:375px;min-height:812px;background:var(--bg);overflow:hidden;position:relative;}
.topbar{display:flex;align-items:center;gap:12px;padding:28px 20px 18px;position:relative;}
.back{width:32px;height:32px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink);border:1px solid var(--border);}
.topbar h1{font-size:17px;font-weight:700;position:absolute;left:56px;right:56px;text-align:center;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.content{padding:0 20px 30px;}
.notif{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);}
.notif.unread{background:#F5FAFF;margin:0 -20px;padding:14px 20px;}
.n-icon{width:38px;height:38px;border-radius:12px;background:#EAF6FF;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.n-info{flex:1;}
.n-info .t{font-size:13px;color:var(--ink);line-height:1.5;}
.n-info .t b{font-weight:800;}
.n-info .time{font-size:11px;color:var(--muted);margin-top:4px;}
.n-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:6px;flex-shrink:0;}
</style></head><body>
<div class="frame">
  <div class="topbar"><div class="back">‹</div><h1>알림함</h1></div>
  <div class="content">
    <div class="notif unread"><div class="n-icon">🪙</div><div class="n-info"><div class="t"><b>헬스가는영희</b>님이 오늘 미션을 완료하고 3,400원을 모았어요</div><div class="time">5분 전</div></div><div class="n-dot"></div></div>
    <div class="notif unread"><div class="n-icon">👏</div><div class="n-info"><div class="t"><b>저축요정민수</b>님이 회원님 인증에 반응을 남겼어요</div><div class="time">32분 전</div></div><div class="n-dot"></div></div>
    <div class="notif"><div class="n-icon">🤖</div><div class="n-info"><div class="t">AI가 회원님의 미션을 오탐 처리했어요. 이의제기를 확인해보세요</div><div class="time">2시간 전</div></div></div>
    <div class="notif"><div class="n-icon">💬</div><div class="n-info"><div class="t"><b>짠돌이철수</b>님이 회원님의 미션에 댓글을 남겼어요</div><div class="time">어제</div></div></div>
    <div class="notif"><div class="n-icon">🎉</div><div class="n-info"><div class="t">"운동 습관 만들기" 챌린지가 목표를 달성했어요!</div><div class="time">2일 전</div></div></div>
  </div>
</div>
</body></html>
