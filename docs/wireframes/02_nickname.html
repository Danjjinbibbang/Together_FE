<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>02. 닉네임 설정</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" /><style>
:root{--bg:#F4F8FC;--surface:#FFFFFF;--ink:#1C2733;--muted:#7C8794;--primary:#18A8F1;--primary-dark:#0E74AD;--accent:#FFBE0F;--danger:#E5484D;--border:#E1E8EF;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fff;display:flex;justify-content:center;}
.frame{width:375px;min-height:812px;background:var(--bg);overflow:hidden;position:relative;}
.content{padding:80px 24px 30px;}
.step{font-size:12px;font-weight:700;color:var(--primary);margin-bottom:10px;}
h1{font-size:22px;font-weight:800;color:var(--ink);margin-bottom:8px;line-height:1.4;}
.sub{font-size:13px;color:var(--muted);margin-bottom:36px;}
.avatar-preview{width:88px;height:88px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;margin:0 auto 28px;}
.field input{width:100%;padding:16px;border-radius:16px;border:1.5px solid var(--primary);background:var(--surface);font-size:16px;color:var(--ink);font-weight:700;text-align:center;}
.helper{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;}
.footer{position:absolute;bottom:0;left:0;right:0;padding:16px 24px 28px;}
.btn-primary{width:100%;padding:16px;border-radius:16px;background:var(--primary);color:#fff;font-size:15px;font-weight:700;text-align:center;}.deprecated-banner{background:#FDEBEC;border:1.5px dashed var(--danger);border-radius:14px;padding:14px;font-size:12px;color:#8A2F2F;line-height:1.6;margin-bottom:30px;font-weight:600;}
</style></head><body>
<div class="frame">
  <div class="content">
    <div class="deprecated-banner">🗑 이 화면은 흐름에서 제거됐어요. 닉네임은 전역이 아니라 챌린지별(MEMBERS.NICKNAME)로 설정되므로, 05(챌린지 생성)·07(챌린지 참여) 화면에 입력 필드로 이동했어요.</div>
    <div class="step">STEP 2 · 2 (사용 안 함)</div>
    <h1>어떤 이름으로<br/>활동하고 싶으세요?</h1>
    <div class="sub">언제든 마이페이지에서 다시 바꿀 수 있어요</div>
    <div class="avatar-preview">짠</div>
    <div class="field"><input type="text" value="짠돌이철수" /></div>
    <div class="helper">2~10자, 한글·영문·숫자만 사용할 수 있어요</div>
  </div>
  <div class="footer"><button class="btn-primary">같이모으기 시작하기</button></div>
</div>
</body></html>
