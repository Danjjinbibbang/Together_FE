<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>06. 초대코드 공유</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" /><style>
:root{--bg:#F4F8FC;--surface:#FFFFFF;--ink:#1C2733;--muted:#7C8794;--primary:#18A8F1;--primary-dark:#0E74AD;--accent:#FFBE0F;--danger:#E5484D;--border:#E1E8EF;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fff;display:flex;justify-content:center;}
.frame{width:375px;min-height:812px;background:var(--bg);overflow:hidden;position:relative;}
.content{padding:40px 24px 30px;text-align:center;}
.check-circle{width:72px;height:72px;border-radius:50%;background:var(--primary);color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
h1{font-size:20px;font-weight:800;color:var(--ink);margin-bottom:8px;}
.sub{font-size:13px;color:var(--muted);margin-bottom:32px;}
.code-box{background:var(--surface);border:1.5px dashed var(--primary);border-radius:18px;padding:22px;margin-bottom:16px;}
.code-box .label{font-size:12px;color:var(--muted);margin-bottom:8px;}
.code-box .code{font-size:28px;font-weight:800;letter-spacing:4px;color:var(--primary-dark);}
.share-row{display:flex;gap:10px;margin-bottom:30px;}
.share-btn{flex:1;padding:14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--border);text-align:center;font-size:13px;font-weight:700;color:var(--ink);}
.footer-btn{width:100%;padding:16px;border-radius:16px;background:var(--accent);color:#5C3D00;font-size:15px;font-weight:800;text-align:center;}
.page-header{padding:24px 20px 0;font-size:12px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.3px;}
</style></head><body>
<div class="frame">
  <div class="page-header">초대코드 공유</div>
  <div class="content">
    <div class="check-circle">✓</div>
    <h1>챌린지가 만들어졌어요!</h1>
    <div class="sub">아래 코드로 친구들을 초대해보세요</div>
    <div class="code-box"><div class="label">초대코드</div><div class="code">JEJU2026</div></div>
    <div class="share-row">
      <div class="share-btn">💬 카카오톡</div>
      <div class="share-btn">🔗 링크 복사</div>
    </div>
  </div>
  <div style="position:absolute;bottom:28px;left:24px;right:24px;"><div class="footer-btn">그룹 홈으로 이동</div></div>
</div>
</body></html>
