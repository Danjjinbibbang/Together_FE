<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>03. 홈 대시보드 (챌린지 리스트 통합)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" /><style>
:root{--bg:#F4F8FC;--surface:#FFFFFF;--ink:#1C2733;--muted:#7C8794;--primary:#18A8F1;--primary-dark:#0E74AD;--accent:#FFBE0F;--danger:#E5484D;--border:#E1E8EF;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fff;display:flex;justify-content:center;}
.frame{width:375px;min-height:812px;background:var(--bg);overflow:hidden;position:relative;}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:28px 20px 4px;position:relative;}
.greet{font-size:18px;font-weight:800;color:var(--ink);position:absolute;left:56px;right:56px;text-align:center;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bell{width:36px;height:36px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;margin-left:auto;}
.dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--danger);}
.content{padding:14px 20px 110px;}
.hero-card{background:linear-gradient(135deg,var(--primary),#0E74AD);border-radius:22px;padding:22px;color:#fff;margin-bottom:22px;}
.hero-card .label{font-size:12px;opacity:.85;margin-bottom:6px;}
.hero-card .total{font-size:26px;font-weight:800;margin-bottom:4px;}
.hero-card .sub{font-size:12px;opacity:.8;}
.section-label{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.section-label span{font-size:12px;font-weight:600;color:var(--muted);}
.card{background:var(--surface);border-radius:20px;border:1px solid var(--border);padding:18px;margin-bottom:14px;}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.card-top .name{font-size:15px;font-weight:800;color:var(--ink);}
.card-top .members{font-size:11px;color:var(--muted);background:#EAF6FF;padding:3px 8px;border-radius:999px;}
.bar{height:8px;background:#EAF0F5;border-radius:999px;overflow:hidden;margin-bottom:8px;}
.bar-fill{height:100%;background:var(--primary);}
.card-bottom{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);}
.card-bottom b{color:var(--primary-dark);}
.fab{
  position:absolute;bottom:96px;right:20px;width:58px;height:58px;border-radius:50%;
  background:var(--accent);color:#5C3D00;display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:700;box-shadow:0 12px 24px rgba(255,190,15,.45);
}
.bottom-tab{position:absolute;bottom:0;left:0;right:0;height:76px;background:var(--surface);border-top:1px solid var(--border);display:flex;padding-bottom:16px;}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:var(--muted);}
.tab-item.active{color:var(--primary);font-weight:700;}
.tab-item .ic{font-size:18px;}
.annotate{position:absolute;top:60px;right:20px;background:#232C36;color:#fff;font-size:10px;font-weight:700;padding:4px 9px;border-radius:6px;z-index:6;}
</style></head><body>
<div class="frame">
  <div class="annotate">v3 · 챌린지탭 제거</div>
  <div class="topbar"><div class="greet">짠돌이철수님 👋</div><div class="bell">🔔<div class="dot"></div></div></div>
  <div class="content">
    <div class="hero-card">
      <div class="label">모든 챌린지 합산 잔액</div>
      <div class="total">126,400원</div>
      <div class="sub">이번 주 +18,200원 모았어요</div>
    </div>
    <div class="section-label">내 챌린지 <span>2개</span></div>
    <div class="card">
      <div class="card-top"><span class="name">✈️ 제주도 여행 저축 모임</span><span class="members">4명</span></div>
      <div class="bar"><div class="bar-fill" style="width:42%"></div></div>
      <div class="card-bottom"><span>126,400 / 300,000원</span><b>42%</b></div>
    </div>
    <div class="card">
      <div class="card-top"><span class="name">💪 운동 습관 만들기</span><span class="members">6명</span></div>
      <div class="bar"><div class="bar-fill" style="width:68%"></div></div>
      <div class="card-bottom"><span>102,000 / 150,000원</span><b>68%</b></div>
    </div>
  </div>
  <div class="fab">+</div>
  <div class="bottom-tab">
    <div class="tab-item active"><div class="ic">🏠</div>홈</div>
    <div class="tab-item"><div class="ic">📅</div>내기록</div>
    <div class="tab-item"><div class="ic">👤</div>마이</div>
  </div>
</div>
</body></html>
