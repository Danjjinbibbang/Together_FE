<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>11. 미션 작성</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" /><style>
:root{--bg:#F4F8FC;--surface:#FFFFFF;--ink:#1C2733;--muted:#7C8794;--primary:#18A8F1;--primary-dark:#0E74AD;--accent:#FFBE0F;--danger:#E5484D;--border:#E1E8EF;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fff;display:flex;justify-content:center;}
.frame{width:375px;min-height:812px;background:var(--bg);overflow:hidden;position:relative;}
.topbar{display:flex;align-items:center;gap:12px;padding:28px 20px 14px;position:relative;}
.back{width:32px;height:32px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink);border:1px solid var(--border);}
.topbar h1{font-size:16px;font-weight:700;position:absolute;left:56px;right:56px;text-align:center;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mission-pill{background:#EAF6FF;color:var(--primary-dark);font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;}
.content{padding:8px 20px 130px;}
.mission-card{background:var(--primary);color:#fff;border-radius:18px;padding:16px;margin-bottom:20px;}
.mission-card .label{font-size:11px;opacity:.8;margin-bottom:4px;}
.mission-card .title{font-size:15px;font-weight:800;}
textarea{width:100%;min-height:160px;padding:16px;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);font-size:14px;color:var(--ink);line-height:1.7;resize:none;}
.char-count{text-align:right;font-size:11px;color:var(--muted);margin-top:6px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-top:20px;}
.toggle-row .t{font-size:13px;font-weight:700;color:var(--ink);}
.toggle-row .d{font-size:11px;color:var(--muted);margin-top:2px;}
.toggle{width:44px;height:26px;border-radius:999px;background:var(--primary);position:relative;}
.toggle .dot{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:3px;right:3px;}
.footer{position:absolute;bottom:0;left:0;right:0;padding:16px 20px 28px;background:linear-gradient(180deg,rgba(244,248,252,0) 0%,var(--bg) 30%);}
.btn-primary{width:100%;padding:16px;border-radius:16px;background:var(--primary);color:#fff;font-size:15px;font-weight:700;text-align:center;}
</style></head><body>
<div class="frame">
  <div class="topbar"><div class="back">‹</div><h1>미션 작성</h1><span class="mission-pill">📝 텍스트</span></div>
  <div class="content">
    <div class="mission-card"><div class="label">오늘의 미션</div><div class="title">오늘 감사한 점 3가지 적기</div></div>
    <textarea placeholder="여기에 자유롭게 적어보세요 (최소 30자)">오늘은 아침에 날씨가 맑아서 기분이 좋았고, 점심에 팀원이 커피를 사줘서 고마웠다. 저녁엔...</textarea>
    <div class="char-count">78 / 최소 30자</div>
    <div class="toggle-row">
      <div><div class="t">공개로 작성하기</div><div class="d">팀원이 내 미션 내용을 볼 수 있어요</div></div>
      <div class="toggle"><div class="dot"></div></div>
    </div>
  </div>
  <div class="footer"><button class="btn-primary">제출하기</button></div>
</div>
</body></html>
