<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>17. 목표 달성 축하</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" /><style>
:root{--bg:#F4F8FC;--surface:#FFFFFF;--ink:#1C2733;--muted:#7C8794;--primary:#18A8F1;--primary-dark:#0E74AD;--accent:#FFBE0F;--danger:#E5484D;--border:#E1E8EF;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fff;display:flex;justify-content:center;}
.frame{width:375px;min-height:812px;background:radial-gradient(circle at 50% 20%,#25B4FF 0%,var(--primary-dark) 100%);overflow:hidden;position:relative;}
.confetti{position:absolute; font-size:20px;}
.c1{top:70px;left:30px;}
.c2{top:100px;right:36px;}
.c3{top:180px;left:60px;}
.c4{top:160px;right:60px;}
.content{padding:150px 30px 30px;text-align:center;}
.trophy{font-size:72px;margin-bottom:20px;}
h1{color:#fff;font-size:24px;font-weight:800;margin-bottom:10px;}
.sub{color:rgba(255,255,255,.85);font-size:13px;margin-bottom:30px;line-height:1.6;}
.stat-card{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;}
.stat-card .amt{font-size:24px;font-weight:800;color:var(--primary-dark);}
.stat-card .label{font-size:12px;color:var(--muted);margin-top:4px;}
.share-btn{width:100%;padding:16px;border-radius:16px;background:var(--accent);color:#5C3D00;font-size:15px;font-weight:800;text-align:center;}
.page-header{position:absolute;top:28px;left:0;right:0;text-align:center;font-size:12px;font-weight:700;color:rgba(255,255,255,.75);letter-spacing:.3px;z-index:6;}
.close-x{position:absolute;top:22px;right:20px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:6;}
</style></head><body>
<div class="frame">
  <div class="page-header">제주도 여행 저축 모임 · 목표 달성</div>
  <div class="close-x">✕</div>
  <div class="confetti c1">🎉</div><div class="confetti c2">✨</div><div class="confetti c3">🎊</div><div class="confetti c4">⭐</div>
  <div class="content">
    <div class="trophy">🏆</div>
    <h1>목표 달성!</h1>
    <div class="sub">"제주도 여행 저축 모임" 팀이<br/>목표 금액 300,000원을 모두 모았어요</div>
    <div class="stat-card"><div class="amt">300,000원</div><div class="label">92일 동안 4명이 함께 모았어요</div></div>
    <div class="share-btn">팀에게 축하 메시지 보내기</div>
  </div>
</div>
</body></html>
