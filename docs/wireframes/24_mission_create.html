<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>24. 미션 생성</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
:root{
  --bg:#F4F8FC; --surface:#FFFFFF; --ink:#1C2733; --muted:#7C8794;
  --primary:#18A8F1; --primary-dark:#0E74AD; --accent:#FFBE0F;
  --danger:#E5484D; --border:#E1E8EF; --ai:#7C3AED; --ai-bg:#F1EDFE;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:#E3EEF7; display:flex; justify-content:center; padding:40px 12px;
}
.frame{
  width:375px; min-height:812px; background:var(--bg);
    overflow:hidden;
  position:relative; 
}
.topbar{display:flex; align-items:center; gap:12px; padding:28px 20px 16px;position:relative;}
.back{
  width:32px; height:32px; border-radius:50%; background:var(--surface);
  display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--ink);
  border:1px solid var(--border);
}
.topbar h1{font-size:17px;font-weight:700;position:absolute;left:56px;right:56px;text-align:center;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tabs{display:flex; gap:8px; padding:0 20px 20px;}
.tab{
  flex:1; padding:14px; border-radius:16px; border:1.5px solid var(--border); background:var(--surface);
  text-align:center; cursor:pointer;
}
.tab.active{border-color:var(--primary); background:#F2F8F5;}
.tab .emoji{font-size:22px; margin-bottom:6px;}
.tab .label{font-size:13px; font-weight:700; color:var(--ink);}
.tab .sub{font-size:11px; color:var(--muted); margin-top:2px;}
.panel{padding:0 20px 120px; display:none;}
.panel.show{display:block;}
.field{margin-bottom:18px;}
.field label{display:block; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:8px;}
.field input, .field textarea{
  width:100%; padding:14px 16px; border-radius:14px; border:1.5px solid var(--border);
  background:var(--surface); font-size:14px; color:var(--ink); font-weight:600;
}
.chip-row{display:flex; gap:8px;}
.chip{
  flex:1; padding:12px; border-radius:12px; border:1.5px solid var(--border); text-align:center;
  font-size:13px; font-weight:700; color:var(--muted);
}
.chip.selected{border-color:var(--primary); color:var(--primary-dark); background:#F2F8F5;}
.ai-box{
  background:var(--ai-bg); border:1px solid #DCCFFB; border-radius:16px; padding:16px; margin-bottom:16px;
}
.ai-box .title{font-size:13px; font-weight:700; color:var(--ai); margin-bottom:8px;}
.ai-generate-btn{
  width:100%; padding:12px; border-radius:12px; background:var(--ai); color:#fff;
  font-size:13px; font-weight:700; text-align:center; margin-top:10px;
}
.suggest-card{
  background:var(--surface); border:1.5px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px;
  display:flex; align-items:center; gap:10px;
}
.suggest-card .check{
  width:20px; height:20px; border-radius:6px; border:2px solid var(--border); flex-shrink:0;
}
.suggest-card.picked{border-color:var(--primary);}
.suggest-card.picked .check{background:var(--primary); border-color:var(--primary);}
.suggest-card .txt .t{font-size:13px; font-weight:700; color:var(--ink);}
.suggest-card .txt .d{font-size:11px; color:var(--muted); margin-top:2px;}
.footer{
  position:absolute; bottom:0; left:0; right:0; padding:16px 20px 28px;
  background:linear-gradient(180deg, rgba(250,246,240,0) 0%, var(--bg) 30%);
}
.btn-primary{
  width:100%; padding:16px; border-radius:16px; background:var(--primary);
  color:#fff; font-size:15px; font-weight:700; text-align:center; border:none;
}
</style>
</head>
<body>
<div class="frame">
  
  <div class="topbar">
    <div class="back">‹</div>
    <h1>새 미션 만들기</h1>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="showPanel('owner')">
      <div class="emoji">✍️</div>
      <div class="label">직접 만들기</div>
      <div class="sub">내가 직접 작성</div>
    </div>
    <div class="tab" onclick="showPanel('ai')">
      <div class="emoji">✨</div>
      <div class="label">AI로 생성하기</div>
      <div class="sub">테마만 정하면 끝</div>
    </div>
  </div>

  <div id="panel-owner" class="panel show">
    <div class="field">
      <label>미션 제목</label>
      <input type="text" placeholder="예: 오늘 감사한 점 3가지 적기" />
    </div>
    <div class="field">
      <label>제출 형식</label>
      <div class="chip-row">
        <div class="chip selected">📝 텍스트</div>
        <div class="chip">📷 사진</div>
      </div>
    </div>
    <div class="field">
      <label>최소 글자 수</label>
      <input type="text" placeholder="예: 30" />
    </div>
    <div class="field">
      <label>보상 금액 범위</label>
      <input type="text" placeholder="100원 ~ 10,000원" />
    </div>
  </div>

  <div id="panel-ai" class="panel">
    <div class="ai-box">
      <div class="title">✨ 어떤 테마의 미션을 원하시나요?</div>
      <input type="text" placeholder="예: 운동, 절약, 독서" style="width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid #DCCFFB; font-size:13px;" />
      <div class="ai-generate-btn">테마로 미션 생성하기</div>
    </div>

    <div class="field">
      <label>생성된 미션 중 추가할 것을 선택하세요</label>
    </div>
    <div class="suggest-card picked">
      <div class="check">✓</div>
      <div class="txt">
        <div class="t">오늘 운동한 부위 사진으로 인증하기</div>
        <div class="d">사진 · 난이도 중</div>
      </div>
    </div>
    <div class="suggest-card">
      <div class="check"></div>
      <div class="txt">
        <div class="t">10분 스트레칭 후 소감 한 줄 남기기</div>
        <div class="d">텍스트 · 난이도 하</div>
      </div>
    </div>
    <div class="suggest-card picked">
      <div class="check">✓</div>
      <div class="txt">
        <div class="t">오늘 걸은 거리 인증샷 남기기</div>
        <div class="d">사진 · 난이도 상</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <button class="btn-primary">미션 추가하기</button>
  </div>
</div>
<script>
function showPanel(which){
  document.getElementById('panel-owner').classList.toggle('show', which==='owner');
  document.getElementById('panel-ai').classList.toggle('show', which==='ai');
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active', (which==='owner' && i===0) || (which==='ai' && i===1));
  });
}
</script>
</body>
</html>
