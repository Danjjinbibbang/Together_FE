<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>16b. 캘린더 테마 색상 선택 (신규)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" /><style>
:root{--bg:#F4F8FC;--surface:#FFFFFF;--ink:#1C2733;--muted:#7C8794;--primary:#18A8F1;--primary-dark:#0E74AD;--accent:#FFBE0F;--border:#E1E8EF;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fff;display:flex;justify-content:center;}
.frame{width:375px;min-height:812px;background:var(--bg);overflow:hidden;position:relative;}
.dim{position:absolute;inset:0;background:rgba(15,23,32,.5);}
.content{padding:80px 20px;color:var(--muted);font-size:12px;text-align:center;}
.sheet{
  position:absolute;bottom:0;left:0;right:0;background:var(--surface);
  border-radius:28px 28px 0 0;padding:12px 24px 32px;box-shadow:0 -10px 30px rgba(0,0,0,.15);
}
.grabber{width:40px;height:4px;background:var(--border);border-radius:999px;margin:0 auto 18px;}
.sheet h2{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:4px;}
.sheet .sub{font-size:12px;color:var(--muted);margin-bottom:6px;}
.challenge-tag{display:inline-flex;align-items:center;gap:6px;background:#F0F3F6;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:20px;}
.swatch-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px;}
.swatch{width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:800;border:3px solid transparent;}
.swatch.selected{border-color:var(--ink);}
.note{font-size:11px;color:var(--muted);text-align:center;margin-bottom:20px;line-height:1.6;}
.btn-primary{width:100%;padding:16px;border-radius:16px;background:var(--primary);color:#fff;font-size:15px;font-weight:700;text-align:center;}
</style></head><body>
<div class="frame">
  <div class="content">캘린더 화면</div>
  <div class="dim"></div>
  <div class="sheet">
    <div class="grabber"></div>
    <h2>캘린더 색상 정하기</h2>
    <div class="sub">이 색상은 나한테만 보여요</div>
    <div class="challenge-tag">✈️ 제주도 여행 저축 모임</div>
    <div class="swatch-grid">
      <div class="swatch selected" style="background:#18A8F1;">✓</div>
      <div class="swatch" style="background:#FF7A59;"></div>
      <div class="swatch" style="background:#22C58B;"></div>
      <div class="swatch" style="background:#8B5CF6;"></div>
      <div class="swatch" style="background:#EC4899;"></div>
      <div class="swatch" style="background:#14B8B0;"></div>
      <div class="swatch" style="background:#F43F5E;"></div>
      <div class="swatch" style="background:#A16207;"></div>
      <div class="swatch" style="background:#64748B;"></div>
      <div class="swatch" style="background:#FFBE0F;"></div>
    </div>
    <div class="note">💡 다른 챌린지에서 이미 쓰고 있는 색상도 선택할 수 있어요. 팀원에게는 보이지 않는 나만의 설정이에요.</div>
    <button class="btn-primary">저장하기</button>
  </div>
</div>
</body></html>
