<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>08. 그룹 홈 v2 — 변경사항 반영</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
:root{
  --bg:#F4F8FC; --surface:#FFFFFF; --ink:#1C2733; --muted:#7C8794;
  --primary:#18A8F1; --primary-dark:#0E74AD; --accent:#FFBE0F;
  --danger:#E5484D; --border:#E1E8EF;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:#E3EEF7; display:flex; justify-content:center; padding:40px 12px;
}
.frame{
  width:375px; min-height:812px; background:var(--bg);
    overflow:hidden;
  position:relative; 
}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:28px 20px 18px;position:relative;}
.topbar-left{display:flex; align-items:center; gap:12px;}
.back{
  width:32px; height:32px; border-radius:50%; background:var(--surface);
  display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--ink);
  border:1px solid var(--border);
}
.topbar h1{font-size:16px;font-weight:700;position:absolute;left:56px;right:56px;text-align:center;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.menu-btn{
  width:32px; height:32px; border-radius:10px; background:var(--surface); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; color:var(--ink);
}
.dropdown{
  position:absolute; top:78px; right:20px; width:200px; background:var(--surface);
  border-radius:16px; border:1px solid var(--border); box-shadow:0 12px 30px rgba(0,0,0,.15);
  overflow:hidden; z-index:10;
}
.dropdown .item{
  padding:14px 16px; font-size:13px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--border);
}
.dropdown .item:last-child{border-bottom:none;}
.dropdown .item.new{background:#FBF3E4;}
.dropdown .item.danger{color:var(--danger);}
.dropdown .badge-new{
  margin-left:auto; font-size:9px; background:var(--danger); color:#fff; padding:2px 6px; border-radius:5px; font-weight:800;
}
.content{padding:4px 20px 100px;}
.progress-card{
  background:var(--primary); border-radius:20px; padding:20px; margin-bottom:20px; color:#fff;
}
.progress-card .title{font-size:13px; opacity:.85; margin-bottom:6px;}
.progress-card .amount{font-size:26px; font-weight:800; margin-bottom:14px;}
.bar{height:10px; background:rgba(255,255,255,.25); border-radius:999px; overflow:hidden;}
.bar-fill{height:100%; width:42%; background:var(--accent); border-radius:999px;}
.section-label{font-size:13px; font-weight:700; color:var(--muted); margin:20px 0 10px;}
.member{
  display:flex; align-items:center; gap:12px; padding:14px; border-radius:16px;
  background:var(--surface); border:1px solid var(--border); margin-bottom:10px;
}
.avatar{
  width:38px; height:38px; border-radius:50%; background:#E4F2FC;
  display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--primary-dark); font-size:13px;
}
.member .info{flex:1;}
.member .name{font-size:13px; font-weight:700; color:var(--ink);}
.member .balance{font-size:12px; color:var(--muted); margin-top:2px;}
.crown{font-size:11px; background:var(--accent); color:#fff; padding:2px 7px; border-radius:999px; font-weight:700; margin-left:6px;}
.feed-entry{
  display:flex; align-items:center; justify-content:space-between; background:var(--surface);
  border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:20px;
  font-size:13px; font-weight:700; color:var(--ink);
}
.today-cta{
  display:flex; align-items:center; justify-content:space-between; background:var(--accent);
  border-radius:14px; padding:14px 16px; margin-bottom:10px;
  font-size:13px; font-weight:800; color:#5C3D00;
}
.annotate{
  position:absolute; bottom:20px; left:20px; right:20px; background:#232220; color:#fff;
  border-radius:14px; padding:12px 14px; font-size:11px; line-height:1.6; opacity:.92;
}
.annotate b{color:var(--accent);}
</style>
</head>
<body>
<div class="frame">
  
  <div class="topbar">
    <div class="topbar-left">
      <div class="back">‹</div>
      <h1>제주도 여행 저축 모임</h1>
    </div>
    <div class="menu-btn">⋮</div>
  </div>

  <div class="dropdown">
    <div class="item">✏️ 정보 수정</div>
    <div class="item">👑 방장 양도</div>
    <div class="item">⚙️ 미션 운영 설정</div>
    <div class="item">🔗 초대코드 조회</div>
    <div class="item danger">🚪 챌린지 탈퇴</div>
  </div>

  <div class="content">
    <div class="progress-card">
      <div class="title">팀 전체 진행률</div>
      <div class="amount">126,400원 / 300,000원</div>
      <div class="bar"><div class="bar-fill"></div></div>
    </div>

    <div class="today-cta">
      <span>🎴 오늘의 미션 뽑기</span>
      <span>›</span>
    </div>

    <div class="feed-entry" onclick="">
      <span>📰 팀 활동 피드 보기</span>
      <span>›</span>
    </div>

    <div class="section-label">멤버별 계좌</div>
    <div class="member">
      <div class="avatar">짠</div>
      <div class="info"><div class="name">짠돌이철수<span class="crown">방장</span></div><div class="balance">잔액 48,200원</div></div>
    </div>
    <div class="member">
      <div class="avatar">헬</div>
      <div class="info"><div class="name">헬스가는영희</div><div class="balance">잔액 51,900원</div></div>
    </div>
    <div class="member">
      <div class="avatar">저</div>
      <div class="info"><div class="name">저축요정민수</div><div class="balance">잔액 26,300원</div></div>
    </div>
  </div>
</div>
</body>
</html>
