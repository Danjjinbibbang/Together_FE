<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>09. 미션 운영 방식 설정 v2 — 변경사항 반영</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
:root{
  --bg:#F4F8FC; --surface:#FFFFFF; --ink:#1C2733; --muted:#7C8794;
  --primary:#18A8F1; --primary-dark:#0E74AD; --accent:#FFBE0F;
  --danger:#E5484D; --border:#E1E8EF;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:#E3EEF7; display:flex; justify-content:center; padding:40px 12px;
}
.frame{
  width:375px; min-height:812px; background:var(--bg);
    overflow:hidden;
  position:relative; 
}
.new-tag{
  position:absolute; top:60px; right:20px; background:var(--danger); color:#fff;
  font-size:10px; font-weight:800; padding:3px 8px; border-radius:6px; z-index:6;
}
.topbar{display:flex; align-items:center; gap:12px; padding:28px 20px 18px;position:relative;}
.back{
  width:32px; height:32px; border-radius:50%; background:var(--surface);
  display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--ink);
  border:1px solid var(--border);
}
.topbar h1{font-size:17px;font-weight:700;position:absolute;left:56px;right:56px;text-align:center;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.content{padding:4px 20px 30px;}
.mode-card{
  background:var(--surface); border:2px solid var(--border); border-radius:20px; padding:18px; margin-bottom:14px;
}
.mode-card.selected{border-color:var(--primary); background:#F2F8F5;}
.mode-card .top{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.mode-card .emoji{font-size:22px;}
.mode-card .name{font-size:15px; font-weight:800; color:var(--ink);}
.mode-card .desc{font-size:12.5px; color:var(--muted); line-height:1.6;}
.manage-link{
  margin-top:14px; padding:12px 14px; background:var(--primary); border-radius:12px;
  display:flex; align-items:center; justify-content:space-between; color:#fff;
  font-size:13px; font-weight:700;
}
.freq-note{
  background:#FBF3E4; border:1px dashed var(--accent); border-radius:14px; padding:12px 14px;
  font-size:12px; color:var(--primary-dark); line-height:1.6; margin-top:20px;
}
.annotate{
  margin-top:20px; background:#232220; color:#fff;
  border-radius:14px; padding:12px 14px; font-size:11px; line-height:1.6; opacity:.92;
}
.annotate b{color:var(--accent);}
</style>
</head>
<body>
<div class="frame">
  
  <div class="topbar">
    <div class="back">‹</div>
    <h1>미션 운영 방식 설정</h1>
  </div>
  <div class="content">
    <div class="mode-card selected">
      <div class="top"><div class="emoji">📋</div><div class="name">고정 미션 풀</div></div>
      <div class="desc">등록해둔 여러 미션 중 매일 하나가 챌린지 전체에 공통으로 랜덤 배정돼요.</div>
      <div class="manage-link">
        <span>🗂 미션 관리로 이동</span>
        <span>›</span>
      </div>
    </div>

    <div class="mode-card">
      <div class="top"><div class="emoji">✨</div><div class="name">AI 추천 미션</div></div>
      <div class="desc">챌린지 테마를 정해두면 AI가 그날의 미션을 자동으로 만들어 배정해요.</div>
    </div>

    <div class="freq-note">
      💡 운영 방식은 주 1회(매주 일요일) 다음 주 것으로 재설정할 수 있어요.
    </div>
  </div>
</div>
</body>
</html>
