<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>07. 챌린지 참여</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" /><style>
:root{--bg:#F4F8FC;--surface:#FFFFFF;--ink:#1C2733;--muted:#7C8794;--primary:#18A8F1;--primary-dark:#0E74AD;--accent:#FFBE0F;--danger:#E5484D;--border:#E1E8EF;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fff;display:flex;justify-content:center;}
.frame{width:375px;min-height:812px;background:var(--bg);overflow:hidden;position:relative;}
.topbar{display:flex;align-items:center;gap:12px;padding:28px 20px 18px;position:relative;}
.back{width:32px;height:32px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink);border:1px solid var(--border);}
.topbar h1{font-size:17px;font-weight:700;position:absolute;left:56px;right:56px;text-align:center;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.content{padding:20px 20px 30px;}
.field{margin-bottom:20px;}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px;}
.field input{width:100%;padding:16px;border-radius:14px;border:1.5px solid var(--primary);background:var(--surface);font-size:18px;color:var(--ink);font-weight:800;text-align:center;letter-spacing:3px;}
.btn-check{width:100%;padding:14px;border-radius:14px;background:#EAF6FF;color:var(--primary-dark);font-size:13px;font-weight:700;text-align:center;margin-bottom:24px;}
.preview-card{background:var(--surface);border-radius:18px;border:1px solid var(--border);padding:18px;text-align:center;}
.preview-card .icon{font-size:32px;margin-bottom:8px;}
.preview-card .name{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:4px;}
.preview-card .meta{font-size:12px;color:var(--muted);}
.footer{position:absolute;bottom:0;left:0;right:0;padding:16px 20px 28px;}
.btn-primary{width:100%;padding:16px;border-radius:16px;background:var(--primary);color:#fff;font-size:15px;font-weight:700;text-align:center;}
</style></head><body>
<div class="frame">
  <div class="topbar"><div class="back">‹</div><h1>초대코드로 참여</h1></div>
  <div class="content">
    <div class="field"><label>초대코드 입력</label><input value="JEJU2026" /></div>
    <div class="btn-check">코드 확인</div>
    <div class="preview-card">
      <div class="icon">✈️</div>
      <div class="name">제주도 여행 저축 모임</div>
      <div class="meta">멤버 4명 · 목표 300,000원</div>
    </div>
    <div class="field" style="margin-top:20px;"><label>이 챌린지에서 쓸 닉네임</label><input placeholder="예: 헬스가는영희" style="text-align:left;letter-spacing:normal;font-weight:600;font-size:15px;padding:14px 16px;border:1.5px solid var(--border);" /></div>
  </div>
  <div class="footer"><button class="btn-primary">참여하기</button></div>
</div>
</body></html>
