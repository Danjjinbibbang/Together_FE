<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>19. 로그인</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" /><style>
:root{--bg:#F4F8FC;--surface:#FFFFFF;--ink:#1C2733;--muted:#7C8794;--primary:#18A8F1;--primary-dark:#0E74AD;--accent:#FFBE0F;--danger:#E5484D;--border:#E1E8EF;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fff;display:flex;justify-content:center;}
.frame{width:375px;min-height:812px;background:linear-gradient(180deg,var(--primary) 0%,#0E74AD 60%);overflow:hidden;position:relative;display:flex;flex-direction:column;}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.logo{width:96px;height:96px;border-radius:28px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:44px;margin-bottom:20px;}
.hero h1{color:#fff;font-size:22px;font-weight:800;}
.hero p{color:rgba(255,255,255,.8);font-size:13px;margin-top:8px;}
.bottom{padding:0 28px 40px;}
.kakao-btn{width:100%;padding:16px;border-radius:16px;background:#FEE500;color:#3C1E1E;font-size:15px;font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;}
.kakao-btn .k{font-size:18px;}
.terms-note{color:rgba(255,255,255,.7);font-size:11px;text-align:center;margin-top:16px;line-height:1.6;}
</style></head><body>
<div class="frame">
  <div class="hero">
    <div class="logo">🐷</div>
    <h1>같이모으기</h1>
    <p>친구와 함께, 미션으로 모으는 저축</p>
  </div>
  <div class="bottom">
    <div class="kakao-btn"><span class="k">💬</span>카카오로 시작하기</div>
    <div class="terms-note">시작하면 서비스 이용약관 및<br/>개인정보 처리방침에 동의하게 돼요</div>
  </div>
</div>
</body></html>
