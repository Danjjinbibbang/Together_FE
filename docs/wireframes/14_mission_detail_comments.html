<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>14. 미션 상세 (댓글/리액션)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" /><style>
:root{--bg:#F4F8FC;--surface:#FFFFFF;--ink:#1C2733;--muted:#7C8794;--primary:#18A8F1;--primary-dark:#0E74AD;--accent:#FFBE0F;--danger:#E5484D;--border:#E1E8EF;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fff;display:flex;justify-content:center;}
.frame{width:375px;min-height:812px;background:var(--bg);overflow:hidden;position:relative;}
.topbar{display:flex;align-items:center;gap:12px;padding:28px 20px 14px;position:relative;}
.back{width:32px;height:32px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink);border:1px solid var(--border);}
.topbar h1{font-size:14.5px;font-weight:700;position:absolute;left:56px;right:56px;text-align:center;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.content{padding:0 20px 150px;}
.author-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.author-row .name{font-size:13px;font-weight:700;color:var(--ink);}
.author-row .time{font-size:11px;color:var(--muted);}
.mission-body{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;font-size:13px;color:var(--ink);line-height:1.7;margin-bottom:14px;}
.reward-chip{display:inline-flex;align-items:center;gap:4px;background:#FFF8E6;color:#8A5A0E;font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px;margin-bottom:20px;}
.reactions{display:flex;gap:8px;margin-bottom:24px;}
.reaction{padding:8px 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--border);font-size:13px;display:flex;align-items:center;gap:6px;font-weight:700;color:var(--ink);}
.reaction.picked{border-color:var(--primary);background:#EAF6FF;color:var(--primary-dark);}
.comment-section-label{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:14px;}
.comment{display:flex;gap:10px;margin-bottom:16px;}
.comment .avatar{width:30px;height:30px;font-size:11px;flex-shrink:0;}
.comment .bubble{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 14px;font-size:12.5px;color:var(--ink);flex:1;}
.comment .bubble .n{font-weight:700;font-size:12px;margin-bottom:3px;}
.footer{position:absolute;bottom:0;left:0;right:0;padding:14px 20px 28px;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:10px;}
.footer input{flex:1;padding:12px 16px;border-radius:999px;border:1px solid var(--border);font-size:13px;background:var(--bg);}
.send{width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;}
</style></head><body>
<div class="frame">
  <div class="topbar"><div class="back">‹</div><h1>오늘 감사한 점 3가지 적기</h1></div>
  <div class="content">
    <div class="author-row"><div class="avatar">짠</div><div><div class="name">짠돌이철수</div><div class="time">오늘 오전 9:12</div></div></div>
    <div class="mission-body">오늘은 아침에 날씨가 맑아서 기분이 좋았고, 점심에 팀원이 커피를 사줘서 고마웠다. 저녁엔 가족과 화상통화를 해서 행복했다.</div>
    <div class="reward-chip">🪙 +1,200원 획득</div>
    <div class="reactions">
      <div class="reaction picked">👏 3</div>
      <div class="reaction">🔥 1</div>
      <div class="reaction">💪</div>
      <div class="reaction">😍</div>
    </div>
    <div class="comment-section-label">댓글 2</div>
    <div class="comment"><div class="avatar">헬</div><div class="bubble"><div class="n">헬스가는영희</div>오늘도 화이팅! 😊</div></div>
    <div class="comment"><div class="avatar">저</div><div class="bubble"><div class="n">저축요정민수</div>가족 화상통화 좋다 ㅎㅎ</div></div>
  </div>
  <div class="footer"><input placeholder="댓글을 남겨보세요" /><div class="send">➤</div></div>
</div>
</body></html>
