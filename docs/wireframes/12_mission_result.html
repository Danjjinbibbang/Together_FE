<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>12. 미션 완료 결과</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" /><style>
:root{--bg:#F4F8FC;--surface:#FFFFFF;--ink:#1C2733;--muted:#7C8794;--primary:#18A8F1;--primary-dark:#0E74AD;--accent:#FFBE0F;--danger:#E5484D;--border:#E1E8EF;--ai:#7C3AED;--ai-bg:#F1EDFE;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fff;display:flex;justify-content:center;}
.frame{width:375px;min-height:812px;background:var(--bg);overflow:hidden;position:relative;}
.content{padding:40px 24px 30px;text-align:center;}
.page-header{padding:24px 20px 0;font-size:12px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.3px;}
.badge-ai{display:inline-flex;align-items:center;gap:6px;background:var(--ai-bg);color:var(--ai);font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;margin-bottom:20px;}
.coin-burst{width:100px;height:100px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:44px;margin:0 auto 20px;box-shadow:0 12px 30px rgba(255,190,15,.4);}
.amount{font-size:30px;font-weight:800;color:var(--primary-dark);margin-bottom:6px;}
.sub{font-size:13px;color:var(--muted);margin-bottom:30px;}
.balance-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;display:flex;justify-content:space-between;margin-bottom:30px;}
.balance-card .item .l{font-size:11px;color:var(--muted);}
.balance-card .item .v{font-size:15px;font-weight:800;color:var(--ink);margin-top:4px;}
.btn-row{display:flex;gap:10px;}
.btn{flex:1;padding:14px;border-radius:14px;text-align:center;font-size:13px;font-weight:700;}
.btn.primary{background:var(--primary);color:#fff;}
.btn.ghost{background:var(--surface);border:1.5px solid var(--border);color:var(--ink);}
</style></head><body>
<div class="frame">
  <div class="page-header">오늘 감사한 점 3가지 적기 · 완료</div>
  <div class="content">
    <div class="badge-ai">🤖 AI가 자동으로 승인했어요</div>
    <div class="coin-burst">🪙</div>
    <div class="amount">+1,200원</div>
    <div class="sub">미션을 완료하고 가상 계좌에 입금됐어요</div>
    <div class="balance-card">
      <div class="item"><div class="l">현재 잔액</div><div class="v">49,400원</div></div>
      <div class="item"><div class="l">연속 기록</div><div class="v">8일 🔥</div></div>
    </div>
    <div class="btn-row">
      <div class="btn ghost">계좌 상세 보기</div>
      <div class="btn primary">그룹 홈으로</div>
    </div>
  </div>
</div>
</body></html>
