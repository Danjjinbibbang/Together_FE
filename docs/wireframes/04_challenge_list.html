<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>04. 챌린지 목록</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" /><style>
:root{--bg:#F4F8FC;--surface:#FFFFFF;--ink:#1C2733;--muted:#7C8794;--primary:#18A8F1;--primary-dark:#0E74AD;--accent:#FFBE0F;--danger:#E5484D;--border:#E1E8EF;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fff;display:flex;justify-content:center;}
.frame{width:375px;min-height:812px;background:var(--bg);overflow:hidden;position:relative;}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:28px 20px 18px;position:relative;}
.topbar h1{font-size:18px;font-weight:800;position:absolute;left:56px;right:56px;text-align:center;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.add{width:34px;height:34px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;margin-left:auto;}
.content{padding:0 20px 100px;}
.card{background:var(--surface);border-radius:20px;border:1px solid var(--border);padding:18px;margin-bottom:14px;}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.card-top .name{font-size:15px;font-weight:800;color:var(--ink);}
.card-top .members{font-size:11px;color:var(--muted);background:#EAF6FF;padding:3px 8px;border-radius:999px;}
.bar{height:8px;background:#EAF0F5;border-radius:999px;overflow:hidden;margin-bottom:8px;}
.bar-fill{height:100%;background:var(--primary);}
.card-bottom{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);}
.card-bottom b{color:var(--primary-dark);}
.empty-join{border:1.5px dashed var(--border);border-radius:20px;padding:24px;text-align:center;color:var(--muted);font-size:13px;}
.empty-join .btn{display:inline-block;margin-top:12px;padding:10px 18px;border-radius:12px;background:var(--accent);color:#5C3D00;font-weight:700;font-size:12.5px;}
</style></head><body>
<div class="frame">
  <div class="topbar"><h1>내 챌린지</h1><div class="add">+</div></div>
  <div class="content">
    <div class="card">
      <div class="card-top"><span class="name">✈️ 제주도 여행 저축 모임</span><span class="members">4명</span></div>
      <div class="bar"><div class="bar-fill" style="width:42%"></div></div>
      <div class="card-bottom"><span>126,400 / 300,000원</span><b>42%</b></div>
    </div>
    <div class="card">
      <div class="card-top"><span class="name">💪 운동 습관 만들기</span><span class="members">6명</span></div>
      <div class="bar"><div class="bar-fill" style="width:68%"></div></div>
      <div class="card-bottom"><span>102,000 / 150,000원</span><b>68%</b></div>
    </div>
    <div class="empty-join">
      새 친구 그룹에 초대받으셨나요?<br/>
      <span class="btn">초대코드로 참여하기</span>
    </div>
  </div>
</div>
</body></html>
