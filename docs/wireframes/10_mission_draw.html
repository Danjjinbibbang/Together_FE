<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>10. 오늘의 미션 카드뽑기</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" /><style>
:root{--bg:#F4F8FC;--surface:#FFFFFF;--ink:#1C2733;--muted:#7C8794;--primary:#18A8F1;--primary-dark:#0E74AD;--accent:#FFBE0F;--danger:#E5484D;--border:#E1E8EF;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fff;display:flex;justify-content:center;}
.frame{width:375px;min-height:812px;background:linear-gradient(180deg,var(--primary) 0%,#0E74AD 100%);overflow:hidden;position:relative;}
.topbar{display:flex;align-items:center;gap:12px;padding:28px 20px 4px;position:relative;}
.back{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;}
.topbar h1{font-size:16px;font-weight:700;position:absolute;left:56px;right:56px;text-align:center;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.content{padding:40px 24px 30px;text-align:center;}
.hint{color:rgba(255,255,255,.85);font-size:13px;margin-bottom:30px;}
.card{width:220px;height:300px;margin:0 auto 30px;background:var(--surface);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 20px 40px rgba(0,0,0,.25);position:relative;}
.card .stamp{position:absolute;top:16px;right:16px;background:#FFF8E6;border:1.5px dashed var(--accent);border-radius:999px;padding:4px 10px;font-size:10px;font-weight:800;color:#8A5A0E;}
.card .emoji{font-size:52px;margin-bottom:18px;}
.card .title{font-size:16px;font-weight:800;color:var(--ink);padding:0 20px;text-align:center;line-height:1.5;}
.reward-tag{display:inline-block;margin-top:16px;background:#FFF8E6;color:#8A5A0E;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:800;}
.draw-btn{width:100%;padding:16px;border-radius:16px;background:var(--accent);color:#5C3D00;font-size:15px;font-weight:800;text-align:center;}
</style></head><body>
<div class="frame">
  <div class="topbar"><div class="back">‹</div><h1>오늘의 미션</h1></div>
  <div class="content">
    <div class="hint">오늘 하루, 챌린지 전체가 함께 도전할<br/>미션 카드를 뽑아보세요 🎴</div>
    <div class="card">
      <div class="stamp">TODAY</div>
      <div class="emoji">✍️</div>
      <div class="title">오늘 감사한 점<br/>3가지 적기</div>
      <div class="reward-tag">🪙 100~2,000원</div>
    </div>
    <button class="draw-btn">미션 시작하기</button>
  </div>
</div>
</body></html>
